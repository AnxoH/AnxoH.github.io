<script>
document.addEventListener("DOMContentLoaded", function() {
    const emailLinks = document.querySelectorAll('a[href^="mailto:"]');
    emailLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const email = this.getAttribute('href').replace('mailto:', '');
            navigator.clipboard.writeText(email).then(() => {
                let toast = document.getElementById('email-toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'email-toast';
                    toast.style.position = 'fixed';
                    toast.style.bottom = '20px';
                    toast.style.left = '50%';
                    toast.style.transform = 'translateX(-50%)';
                    toast.style.backgroundColor = '#10B981'; // Tailwind emerald-500
                    toast.style.color = '#fff';
                    toast.style.padding = '8px 16px';
                    toast.style.borderRadius = '8px';
                    toast.style.fontWeight = '500';
                    toast.style.zIndex = '9999';
                    toast.style.transition = 'opacity 0.3s ease-in-out';
                    toast.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)';
                    document.body.appendChild(toast);
                }
                toast.innerText = 'Email copied: ' + email;
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 3000);
            });
        });
    });
});
</script>
